name: rust

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The desktop binary is a macOS alpha. Its macOS artifact renderers are
      # deliberately absent on Linux, where -D warnings would classify those
      # target-gated implementations as dead code. The full workspace remains
      # mandatory in the macOS job below.
      - run: cargo clippy --workspace --exclude mesh-desktop --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --exclude mesh-desktop

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Preserve every failure in one run; an unrelated early failure must not hide later evidence.
      - run: cargo nextest run --workspace --no-fail-fast
      - run: npm run test:macos-renderers
      - run: npm run verify:demo

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/program/license-check.mjs
      - run: node tools/program/license-check.mjs --self-test

  desktop-and-docs:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/ui-next/package-lock.json
      - run: npm run verify:repository
      - run: npm run verify:docs
      - run: npm run verify:storage
      - run: npm run verify:desktop
