name: rust

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The desktop binary is a macOS alpha. Its macOS artifact renderers are
      # deliberately absent on Linux, where -D warnings would classify those
      # target-gated implementations as dead code. The full workspace remains
      # mandatory in the macOS job below.
      - run: cargo clippy --workspace --exclude mesh-desktop --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    # Keep test execution bounded separately from checkout, cache restore and compilation.
    # The growing recovery campaign must not lose its execution budget to a cold build.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Build Linux test binaries
        run: cargo nextest run --workspace --exclude mesh-desktop --no-run
      - name: Run Linux tests
        timeout-minutes: 15
        run: cargo nextest run --workspace --exclude mesh-desktop

  test-macos-native:
    name: test-macos-native (${{ matrix.shard }}/3)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse the prior macOS job cache across all three equivalent builds.
          shared-key: test-macos
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prove the partitions cover the complete native inventory
        shell: bash
        run: |
          set -euo pipefail
          inventory_dir="$RUNNER_TEMP/mesh-native-inventory"
          mkdir -p "$inventory_dir"
          runner_version="$(cargo nextest --version)"
          if [[ "$runner_version" != 'cargo-nextest 0.9.145 ('* ]]; then
            printf 'Unexpected nextest version: %s\n' "$runner_version" >&2
            exit 1
          fi
          printf '%s\n' "$runner_version"
          cargo nextest list --workspace --message-format json > "$inventory_dir/full.json"
          for partition in 1 2 3; do
            cargo nextest list --workspace --message-format json --partition "hash:$partition/3" > "$inventory_dir/part-$partition.json"
          done
          node tools/program/macos-test-coverage.mjs "$inventory_dir/full.json" "$inventory_dir/part-1.json" "$inventory_dir/part-2.json" "$inventory_dir/part-3.json"
      - name: Run the complete selected native partition
        run: cargo nextest run --workspace --no-fail-fast --partition hash:${{ matrix.shard }}/3
      # Every former macOS step remains required. The complete daemon and renderer
      # checks run on worker one; no test assertion or deadline is relaxed.
      - if: matrix.shard == 1
        run: npm run verify:demo
      - if: matrix.shard == 1
        run: npm run test:macos-renderers

  test-macos:
    needs: [test-macos-native]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Require every macOS partition to succeed
        env:
          MESH_MACOS_PARTITION_RESULTS: ${{ toJSON(needs) }}
        run: node tools/program/macos-test-coverage.mjs --result

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/program/license-check.mjs
      - run: node tools/program/license-check.mjs --self-test

  desktop-and-docs:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/desktop/ui-next/package-lock.json
      - run: npm run verify:repository
      - run: npm run verify:docs
      - run: npm run verify:storage
      - run: npm run verify:desktop
