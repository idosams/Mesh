# 0.9.145 fixes inherited sibling capture pipes on Apple platforms (nextest PR #3553).
# Keep leak detection and deadlines unchanged; older runners can report false handle leaks.
nextest-version = "0.9.145"

[[profile.default.overrides]]
# Start the longest independent recovery campaign immediately, rather than spending
# its CI deadline queued behind shorter tests. Keep its assertions and all deadlines.
filter = 'test(saved_ignore_rules_bind_candidate_without_changing_empty_reservation)'
priority = 100

[[profile.default.overrides]]
# This wall-clock boundary test intentionally sleeps across two checkpoint timers.
# Reserve the complete nextest worker pool so unrelated CPU and I/O pressure cannot
# turn scheduler delay into a false product failure. The assertion and timing
# bounds remain unchanged.
filter = 'test(continuous_activity_cannot_postpone_the_maximum_time_bound)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
# Native FSEvents registration is a host-global service. A sampled failing run was blocked in
# its registration RPC while the full suite generated unrelated filesystem load. Keep the real
# callback/root-replacement assertions and their eight-second deadlines, with exclusive suite
# capacity. Separate controlled blocked-registration tests prove capture and stop stay responsive.
filter = 'test(native_events_capture_nested_edits_and_atomic_replacement_before_reconciliation) | test(native_root_change_wakes_capture_without_adopting_the_replacement)'
threads-required = "num-test-threads"
