\* THE HISTORY CONFIGURATION. Five ChangeSets, no approvals, one epoch: the
\* delivery half of the model at the deepest causal history that terminates
\* here. This one MUST PASS.
\*
\* This is the configuration that answers "does the head rule survive a longer
\* history" rather than "does publication survive a race". Approve and Publish
\* are unreachable in it (MaxApprovals is zero), so the publication invariants
\* hold vacuously and are checked in mesh.cfg and mesh-publication.cfg instead.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 5
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AppliedIsExactlyWhatTheCausalRuleAdmits
    NoDeliveredChangeSetIsDropped
    NoHonestRefusal
    CausalOrderIsRespected
    Convergence
    NoSilentDivergence
    AcknowledgedWorkIsNeverDiscarded
    ConcurrentWorkIsPreserved
    OnlyAnExactHumanReviewedStateAdvances
    CompareAndSwapHeld
    ApprovalIsSingleUse
    CanonicalContentIsAvailable
    CanonicalAdmittedInItsOwnEpoch

CHECK_DEADLOCK FALSE
