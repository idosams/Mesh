\* I7(a), THE MUTATION. `Rejection::WouldCycle` is removed from the move rule
\* --- `crates/mesh-materializer/src/apply.rs::move_entry` without its
\* `is_self_or_ancestor` call. This configuration MUST FAIL, on
\* DirectoryAncestryIsAcyclic.
\*
\* Every move in the counterexample is valid against the state its author
\* could see. The cycle is produced by applying two CONCURRENT moves in one
\* order, which is why a check made once at authoring time is not the check
\* that matters and the per-step check in the fold is.

CONSTANTS
    Peers = {p1, p2}
    Objects = {a, b, c}
    Root = r
    MaxOps = 2

    MUT_MOVE_WITHOUT_CYCLE_CHECK = TRUE
    MUT_MATERIALIZE_IN_ARRIVAL_ORDER = FALSE

SPECIFICATION Spec

INVARIANTS
    DirectoryAncestryIsAcyclic

CHECK_DEADLOCK FALSE
