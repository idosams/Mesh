\* I5, THE MUTATION. A second arrival of an identifier the peer already holds
\* re-ranks that record -- the fold that treats "received again" as "received".
\* This configuration MUST FAIL, on DuplicateDeliveryIsIdempotent.
\*
\* The applied set does not change in the counterexample. Only the order does,
\* so only the head does, and no set the peer can be asked about reports that
\* anything moved. That is what makes this worth a check rather than a comment:
\* the failure has no local symptom.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 0

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = TRUE

SPECIFICATION Spec

PROPERTY DuplicateDeliveryIsIdempotent

CHECK_DEADLOCK FALSE
