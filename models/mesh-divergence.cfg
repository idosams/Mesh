\* THE DIVERGENCE CONFIGURATION. No guard is removed here. One ASSUMPTION is:
\* identifiers are no longer assumed to be the digests of the records
\* delivered under them.
\*
\* This configuration MUST FAIL, on NoSilentDivergence -- two peers, the same
\* identifier set, two different heads, and no refusal. `crates/mesh-state`
\* states the ceiling in its own crate documentation ("a caller that hands
\* this crate an identifier it did not verify gets a head derived from records
\* it did not verify"); this is that sentence with a trace attached.
\*
\* Two ChangeSets and five steps are enough, which was itself a finding: the
\* first version of this file said three were needed, on the reasoning that
\* with two the causal-depth order and the identifier order agree. They agree
\* for an honest history. A forger does not need to reorder a chain -- it
\* turns a CONCURRENT pair into a chain in one peer's view, and that alone
\* moves the head. models/README.md, section "The finding", has the trace and
\* names the boundary that has to close it.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 0

    IdentifiersAreVerified = FALSE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    NoSilentDivergence
    ConvergenceUnderIdentifierBinding

CHECK_DEADLOCK FALSE
