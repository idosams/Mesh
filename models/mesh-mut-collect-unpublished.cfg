\* MUTATION: MUT_COLLECT_UNPUBLISHED
\*
\* Collect anything the canonical head does not reference, instead of only
\* what no retained root reaches. Charter P5 removed.
\*
\* What the counterexample shows: acknowledged work discarded --- including
\* the losing side of a conflict, which is exactly the resolution rule this
\* protocol refuses to have.
\*
\* This configuration MUST FAIL, and must fail on AcknowledgedWorkIsNeverDiscarded.
\* Only that invariant is listed: TLC stops at the first violation, so a
\* configuration listing several would not say which guard the mutation
\* actually removed.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 2
    MaxApprovals = 2
    MaxPublications = 3
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = TRUE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    AcknowledgedWorkIsNeverDiscarded

CHECK_DEADLOCK FALSE
