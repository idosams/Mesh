\* THE BASE CONFIGURATION. Every guard in place, every invariant checked, all
\* eight modelled behaviours reachable. This one MUST PASS.
\*
\* One human, one agent, three ChangeSets, two policy epochs, one approval
\* envelope, one admission, one outage. Three ChangeSets is the smallest size
\* at which a ChangeSet can name two concurrent causal parents -- a merge --
\* and merges are where convergence is worth checking at all.
\*
\* Concurrent publication needs two envelopes and is checked separately, in
\* mesh-publication.cfg; deeper histories are checked in mesh-history.cfg.
\* models/README.md, section "What was checked", carries the measured cost of
\* each and says why the three are not one run.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 3
    MaxEpoch = 2
    MaxApprovals = 1
    MaxPublications = 1
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AppliedIsExactlyWhatTheCausalRuleAdmits
    NoDeliveredChangeSetIsDropped
    NoHonestRefusal
    CausalOrderIsRespected
    Convergence
    ConvergenceUnderIdentifierBinding
    NoSilentDivergence
    AcknowledgedWorkIsNeverDiscarded
    ConcurrentWorkIsPreserved
    OnlyAnExactHumanReviewedStateAdvances
    CompareAndSwapHeld
    ApprovalIsSingleUse
    CanonicalContentIsAvailable
    CanonicalAdmittedInItsOwnEpoch

CHECK_DEADLOCK FALSE
