\* MUTATION: MUT_SILENT_REBASE
\*
\* Admit the reviewed changes onto the current canonical head rather than
\* admitting exactly the reviewed state. Charter P7 removed.
\*
\* What the counterexample shows: a canonical head no human ever reviewed ---
\* the union of the reviewed state and whatever was already canonical. Every
\* signature involved is valid. That is what makes it worth checking.
\*
\* This configuration MUST FAIL, and must fail on OnlyAnExactHumanReviewedStateAdvances.
\* Only that invariant is listed: TLC stops at the first violation, so a
\* configuration listing several would not say which guard the mutation
\* actually removed.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 2
    MaxApprovals = 2
    MaxPublications = 3
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = TRUE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    OnlyAnExactHumanReviewedStateAdvances

CHECK_DEADLOCK FALSE
