\* I5. DUPLICATE DELIVERY IS IDEMPOTENT. This one MUST PASS.
\*
\* An action property rather than an invariant, so it gets its own
\* configuration: a temporal property is checked over the behaviour graph and
\* costs more than the safety run does. Everything not needed to hand a peer
\* an identifier it already holds is switched off -- no approvals, no
\* admissions, no epoch rotation, no outages -- because none of them can
\* affect what a duplicate does and all of them multiply the graph.
\*
\* Three ChangeSets rather than two, so that a redelivered record has records
\* both before and after it in the causal order: a re-ranking that moved a
\* record to the end of a two-element order is caught by a weaker check than
\* one that has to move it past a record on each side.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 3
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 0

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AppliedIsExactlyWhatTheCausalRuleAdmits
    NoHonestRefusal

PROPERTY DuplicateDeliveryIsIdempotent

CHECK_DEADLOCK FALSE
