\* THE RECONNECTION CONFIGURATION. The only configuration that checks a
\* temporal property rather than an invariant, and the only one that needs
\* fairness. This one MUST PASS.
\*
\* The property: if no peer stays offline forever, every peer ends up holding
\* every ChangeSet that was authored. That is the whole of "a long-offline
\* peer returning" in docs/consistency.md section 5 --- reconciliation is
\* modelled as nothing more than delivery being repeatedly enabled.
\*
\* Two ChangeSets, no approvals, one epoch. Liveness checking builds the
\* behaviour graph rather than a state graph, so it costs more per state than
\* every other configuration here; models/README.md carries the measurement.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION LiveSpec

INVARIANTS
    TypeOK

PROPERTY
    EventuallyEveryReconnectedPeerConverges

CHECK_DEADLOCK FALSE
