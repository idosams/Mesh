\* I7, THE BASE CONFIGURATION. Both rules in place. This one MUST PASS.
\*
\* Two peers, three movable directories under a root, three moves. Three is
\* the smallest size at which the interesting case exists: two peers each
\* author a move that is valid against their own state, and applying both in
\* one order would close a cycle. Three moves additionally admits the
\* three-object cycle a -> b -> c -> a, where no PAIR of the moves would
\* cycle and only the composition would.
\*
\* MaxOps = 3 with two peers is also where the cost sits: see
\* models/README.md, "What was checked", for the measured state count.

CONSTANTS
    Peers = {p1, p2}
    Objects = {a, b, c}
    Root = r
    MaxOps = 3

    MUT_MOVE_WITHOUT_CYCLE_CHECK = FALSE
    MUT_MATERIALIZE_IN_ARRIVAL_ORDER = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    DirectoryAncestryIsAcyclic
    ConcurrentMovesResolveIdenticallyOnEveryPeer
    NoObjectIsLostToAMove
    ASoloMoveIsNeverRejected

CHECK_DEADLOCK FALSE
