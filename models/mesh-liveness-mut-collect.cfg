\* MUTATION: MUT_COLLECT_UNPUBLISHED, against the reconnection property.
\*
\* Collect anything the canonical head does not reference. The same mutation
\* mesh-mut-collect-unpublished.cfg runs against an invariant, run here against
\* the temporal property, because a liveness property nothing can break is
\* worth exactly as little as an invariant nothing can break.
\*
\* This configuration MUST FAIL, on EventuallyEveryReconnectedPeerConverges.
\* What the counterexample shows: a collector that removes work faster than
\* replication restores it, so the peers never settle on one causal set at all.
\*
\* MUT_DROP_ORPHAN, the other candidate, does NOT refute this property and is
\* deliberately not used here: a dropped ChangeSet is redelivered, and under
\* strongly fair delivery it eventually arrives after its causal parent and
\* applies. Dropping early work is a SAFETY failure --- it is reported
\* delivered and it is gone --- and it is caught by
\* NoDeliveredChangeSetIsDropped, not here. models/README.md says so under
\* "What the mutations do and do not reach".

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = TRUE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION LiveSpec

INVARIANTS
    TypeOK

PROPERTY
    EventuallyEveryReconnectedPeerConverges

CHECK_DEADLOCK FALSE
