\* MUTATION: MUT_ORDER_BY_CLOCK
\*
\* Order the applied set by a clock reading instead of causal depth. OG-6
\* removed --- this is the mutation that makes "never wall-clock" refutable.
\*
\* What the counterexample shows: a causal parent ordered after its own child,
\* because the clock in this model runs backwards, which is what a badly set
\* machine does.
\*
\* This configuration MUST FAIL, and must fail on CausalOrderIsRespected.
\* Only that invariant is listed: TLC stops at the first violation, so a
\* configuration listing several would not say which guard the mutation
\* actually removed.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 2
    MaxApprovals = 2
    MaxPublications = 3
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = TRUE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    CausalOrderIsRespected

CHECK_DEADLOCK FALSE
