\* MUTATION: MUT_PUBLISH_WITHOUT_CONTENT
\*
\* Admit a canonical transition whose content is not retrievable. SG-9 and I3
\* removed.
\*
\* What the counterexample shows: the canonical head references content no
\* peer holds. The shared version cannot be materialized by anybody.
\*
\* This configuration MUST FAIL, and must fail on CanonicalContentIsAvailable.
\* Only that invariant is listed: TLC stops at the first violation, so a
\* configuration listing several would not say which guard the mutation
\* actually removed.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 2
    MaxApprovals = 2
    MaxPublications = 3
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = TRUE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    CanonicalContentIsAvailable

CHECK_DEADLOCK FALSE
