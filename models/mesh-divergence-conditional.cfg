\* I6, THE CONDITION. Identical to mesh-divergence.cfg in every constant --
\* identifiers are not assumed to be the digests of the records delivered
\* under them, so a forged record can reach a peer -- and it checks the ONE
\* invariant that survives it. This one MUST PASS.
\*
\* Read the two configurations together. In the same state space:
\*
\*   mesh-divergence.cfg              Convergence fails, in five steps
\*   mesh-divergence-conditional.cfg  ConvergenceUnderIdentifierBinding holds
\*
\* That pair is ADR-0015's "conditionally yes" as a checked result rather than
\* an argued one. The condition it names -- a ChangeSet's identifier binds its
\* causal parent set, and the receiver verifies the binding -- is sufficient
\* here, and necessary, because the same run without it produces a trace.
\*
\* Bounded, and only bounded: two ChangeSets, two peers, one forgery. It is
\* not a proof and no inductive invariant is written. models/README.md,
\* "Bounded, not proved", says what that costs.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 0

    IdentifiersAreVerified = FALSE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ConvergenceUnderIdentifierBinding
    NoDeliveredChangeSetIsDropped
    AcknowledgedWorkIsNeverDiscarded

CHECK_DEADLOCK FALSE
