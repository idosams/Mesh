\* MUTATION: MUT_EPOCH_IGNORED
\*
\* Admit an envelope issued under a prior policy epoch. TG-7 removed.
\*
\* What the counterexample shows: authority surviving its own revocation.
\*
\* This configuration MUST FAIL, and must fail on CanonicalAdmittedInItsOwnEpoch.
\* Only that invariant is listed: TLC stops at the first violation, so a
\* configuration listing several would not say which guard the mutation
\* actually removed.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 2
    MaxApprovals = 2
    MaxPublications = 3
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = TRUE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    CanonicalAdmittedInItsOwnEpoch

CHECK_DEADLOCK FALSE
