\* I7(b), THE MUTATION. The fold applies the moves in the order they arrived
\* instead of the order derived from the set --- `order.rs` names exactly this
\* bug in its own module comment. This configuration MUST FAIL, on
\* ConcurrentMovesResolveIdenticallyOnEveryPeer.
\*
\* The tree stays acyclic in the counterexample, and that is the point: both
\* peers refuse a move, each refuses a DIFFERENT one, both look healthy, and
\* the two workspaces are permanently different states with no surface able
\* to see it.

CONSTANTS
    Peers = {p1, p2}
    Objects = {a, b, c}
    Root = r
    MaxOps = 2

    MUT_MOVE_WITHOUT_CYCLE_CHECK = FALSE
    MUT_MATERIALIZE_IN_ARRIVAL_ORDER = TRUE

SPECIFICATION Spec

INVARIANTS
    ConcurrentMovesResolveIdenticallyOnEveryPeer

CHECK_DEADLOCK FALSE
