\* I6, THE MUTATION. The causal order is replaced by the order records arrived
\* HERE. This configuration MUST FAIL, on Convergence.
\*
\* It closes a negative result the model shipped with: models/README.md
\* recorded that no mutation in the campaign refuted `Convergence` on its own,
\* because under the identifier-integrity assumption the head is a pure
\* function of the applied set in both the action and the invariant. That is a
\* statement about the RULE, and the rule is what a mutation is supposed to
\* remove. This one removes it -- the order stops being derived from the set
\* and starts being observed -- and two peers holding one identifier set,
\* having received it in different orders, hold two heads.
\*
\* `ConvergenceUnderIdentifierBinding` fails here too, and that is correct
\* rather than a defect in it: identifiers are honest in this configuration,
\* so ADR-0015's condition holds and convergence still does not. The condition
\* is necessary; it was never claimed sufficient on its own of an arbitrary
\* fold, and this is the counterexample that says so.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 1
    MaxApprovals = 0
    MaxPublications = 0
    MaxOutages = 0

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = TRUE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    Convergence

CHECK_DEADLOCK FALSE
