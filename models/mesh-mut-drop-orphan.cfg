\* MUTATION: MUT_DROP_ORPHAN
\*
\* Drop a ChangeSet that arrives before its causal parent, instead of holding
\* it as a known-missing dependency. The other half of OG-3.
\*
\* What the counterexample shows: delivered work in no outcome at all --- not
\* applied, not held, not refused, not collected. Silently gone, and the
\* sender has no way to find out.
\*
\* This configuration MUST FAIL, and must fail on NoDeliveredChangeSetIsDropped.
\* Only that invariant is listed: TLC stops at the first violation, so a
\* configuration listing several would not say which guard the mutation
\* actually removed.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 2
    MaxApprovals = 2
    MaxPublications = 3
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = TRUE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    NoDeliveredChangeSetIsDropped

CHECK_DEADLOCK FALSE
