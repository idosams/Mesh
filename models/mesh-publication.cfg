\* THE PUBLICATION CONFIGURATION. Two approval envelopes and three admission
\* attempts, so that compare-and-swap has something to arbitrate: two humans'
\* approvals written against one canonical head, and a replay of a spent one.
\* This one MUST PASS.
\*
\* Two ChangeSets rather than three. The envelope-and-admission dimension is
\* what makes this configuration expensive; the causal-history dimension is
\* what makes mesh.cfg expensive. Multiplying them was measured at over ten
\* million states without terminating, which is why they are two runs.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 2
    MaxEpoch = 2
    MaxApprovals = 2
    MaxPublications = 3
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = FALSE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AppliedIsExactlyWhatTheCausalRuleAdmits
    NoDeliveredChangeSetIsDropped
    NoHonestRefusal
    CausalOrderIsRespected
    Convergence
    NoSilentDivergence
    AcknowledgedWorkIsNeverDiscarded
    ConcurrentWorkIsPreserved
    OnlyAnExactHumanReviewedStateAdvances
    CompareAndSwapHeld
    ApprovalIsSingleUse
    CanonicalContentIsAvailable
    CanonicalAdmittedInItsOwnEpoch

CHECK_DEADLOCK FALSE
