\* MUTATION: MUT_APPLY_WITHOUT_PARENTS, against the refusal invariant.
\*
\* The same removed guard as mesh-mut-apply-without-parents.cfg --- apply a
\* ChangeSet whose causal parents have not arrived --- pointed at the second
\* invariant it breaks. Two configurations rather than one because TLC stops
\* at the first violation, and a run reporting only one of them would leave
\* the other looking unreached.
\*
\* This configuration MUST FAIL, and must fail on NoHonestRefusal.
\* What the counterexample shows: honestly authored work refused, because a
\* receiver that applies early derives a base head from an incomplete causal
\* set and then disbelieves the author. Work discarded for being early is the
\* failure that hides behind a clean-looking run.
\*
\* THREE ChangeSets, and the reason is worth stating because it was measured
\* rather than guessed: with two, a receiver missing the one causal parent
\* derives the same base head the author claimed --- the missing ancestor has
\* no ancestors of its own to be missing --- so the mutation applies bad work
\* silently and no refusal ever happens. The refusal needs a grandparent.

CONSTANTS
    Humans = {h1}
    Agents = {g1}
    MaxChangeSets = 3
    MaxEpoch = 2
    MaxApprovals = 1
    MaxPublications = 1
    MaxOutages = 1

    IdentifiersAreVerified = TRUE

    MUT_APPLY_WITHOUT_PARENTS = TRUE
    MUT_DROP_ORPHAN = FALSE
    MUT_ORDER_BY_CLOCK = FALSE
    MUT_NO_COMPARE_AND_SWAP = FALSE
    MUT_AGENT_MAY_APPROVE = FALSE
    MUT_SILENT_REBASE = FALSE
    MUT_PUBLISH_WITHOUT_CONTENT = FALSE
    MUT_COLLECT_UNPUBLISHED = FALSE
    MUT_REPLAY_APPROVAL = FALSE
    MUT_EPOCH_IGNORED = FALSE
    MUT_ORDER_BY_ARRIVAL = FALSE
    MUT_REDELIVER_REORDERS = FALSE

SPECIFICATION Spec

INVARIANTS
    NoHonestRefusal

CHECK_DEADLOCK FALSE
