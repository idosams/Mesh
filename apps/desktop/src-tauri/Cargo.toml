[package]
name = "mesh-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
default = ["git-integration"]
git-integration = ["dep:mesh-git-bridge"]

[[bin]]
name = "mesh-desktop"
path = "main.rs"

[dependencies]
mesh-approval = { path = "../../../crates/mesh-approval", version = "=0.0.0" }
mesh-daemon = { path = "../../../crates/mesh-daemon", version = "=0.0.0" }
mesh-crypto = { path = "../../../crates/mesh-crypto", version = "=0.0.0" }
mesh-keychain = { path = "../../../platform/mesh-keychain", version = "=0.0.0" }
mesh-mcp = { path = "../../../crates/mesh-mcp", version = "=0.0.0" }
mesh-git-bridge = { path = "../../../crates/mesh-git-bridge", version = "=0.0.0", optional = true }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "=2.7.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
