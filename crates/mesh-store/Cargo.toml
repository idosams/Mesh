[package]
name = "mesh-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The production driver for the local metadata index. `bundled` makes the
# database independent of an operator-installed SQLite version; default
# features stay off because the executor needs no optional APIs beyond the
# bundled engine (rusqlite's own core closure still includes hashlink).
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }
