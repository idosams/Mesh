[package]
name = "mesh-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]

[[bin]]
name = "mesh-mcp"
path = "src/main.rs"

# End-to-end tests run the actual MCP binary against the native fleet host.
[dev-dependencies]
mesh-daemon = { path = "../mesh-daemon", version = "=0.0.0" }
mesh-store = { path = "../mesh-store", version = "=0.0.0" }
mesh-types = { path = "../mesh-types", version = "=0.0.0" }
mesh-crypto = { path = "../mesh-crypto", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "zeroize"] }
